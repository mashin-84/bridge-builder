<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Builder - 峽谷橋樑工程師</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1a2234 100%);
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Microsoft JhengHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .container {
    width: 100%;
    max-width: 860px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 48px 36px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 9999px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: #38bdf8;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 14px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .desc {
    color: #94a3b8;
    font-size: 16px;
    line-height: 1.6;
    max-width: 600px;
    margin: 0 auto 40px;
  }
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 36px;
  }
  .mode-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 28px 24px;
    text-align: left;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .mode-card.active {
    cursor: pointer;
  }
  .mode-card.active:hover {
    background: rgba(56, 189, 248, 0.08);
    border-color: rgba(56, 189, 248, 0.5);
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
  }
  .mode-card.disabled {
    opacity: 0.6;
    cursor: not-allowed;
    border-style: dashed;
  }
  .mode-title {
    font-size: 20px;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mode-desc {
    font-size: 14px;
    color: #94a3b8;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .btn-enter {
    align-self: flex-start;
    padding: 8px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 700;
    background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    color: #ffffff;
    border: 1px solid rgba(56, 189, 248, 0.4);
    box-shadow: 0 0 14px rgba(2, 132, 199, 0.35);
  }
  .tag-soon {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: #fbbf24;
  }
  .footer-note {
    font-size: 12.5px;
    color: #64748b;
    line-height: 1.6;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 24px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="badge">STEM 物理力學互動模擬</div>
  <h1>峽谷橋樑工程師</h1>
  <p class="desc">
    利用桁架結構與材料力學特性，在預算內設計能乘載重型卡車通行的便橋。點選下方模式展開挑戰：
  </p>

  <div class="mode-grid">
    <!-- 經典模式入口 -->
    <a href="classic.html" class="mode-card active">
      <div>
        <div class="mode-title">
          <span>經典挑戰模式</span>
          <span style="color: #38bdf8;">➔</span>
        </div>
        <div class="mode-desc">
          包含基礎教學引導關卡與10道漸進式重力考驗。考驗三角形桁架配置與最佳預算效益。
        </div>
      </div>
      <div class="btn-enter">開始挑戰</div>
    </a>

    <!-- 即將推出模式 -->
    <div class="mode-card disabled">
      <div>
        <div class="mode-title">
          <span>可能會更新的模式</span>
          <span class="tag-soon">COMING SOON</span>
        </div>
        <div class="mode-desc">
          無預算與節點限制，自由設計超大跨距結構，進行極限載重應力破壞實驗(可能會更新)。
        </div>
      </div>
      <div style="font-size: 12px; font-weight: 600; color: #64748b;">敬請期待</div>
    </div>
  </div>

  <div class="footer-note">
    本模擬系統為非營利教育推廣用途，靈感啟發自經典桁架工程力學與線上物理模擬遊戲。<br>
    建議使用電腦搭配滑鼠操作以取得最佳體驗。
  </div>
</div>

</body>
</html>
