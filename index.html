<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Builder - 峽谷橋樑工程師</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1a2234 100%);
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Microsoft JhengHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .container {
    width: 100%;
    max-width: 860px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 48px 36px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 9999px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: #38bdf8;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 14px;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .desc {
    color: #94a3b8;
    font-size: 16px;
    line-height: 1.6;
    max-width: 600px;
    margin: 0 auto 36px;
  }
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-bottom: 36px;
  }
  .mode-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 28px 24px;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .mode-title {
    font-size: 20px;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mode-desc {
    font-size: 14px;
    color: #94a3b8;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn-launch {
    flex: 1;
    min-width: 130px;
    text-align: center;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-sizing: border-box;
  }
  .btn-desktop {
    background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    color: #ffffff;
    border: 1px solid rgba(56, 189, 248, 0.4);
    box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
  }
  .btn-desktop:hover {
    background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
    transform: translateY(-2px);
  }
  .btn-mobile {
    background: rgba(56, 189, 248, 0.1);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.4);
  }
  .btn-mobile:hover {
    background: rgba(56, 189, 248, 0.2);
    transform: translateY(-2px);
  }
  .btn-sandbox {
    background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
    color: #ffffff;
    border: 1px solid rgba(251, 191, 36, 0.45);
    box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
  }
  .btn-sandbox:hover {
    background: linear-gradient(135deg, #b45309 0%, #92400e 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(251, 191, 36, 0.55);
  }
  .tag-sandbox {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: #fbbf24;
  }
  .footer-note {
    font-size: 12.5px;
    color: #64748b;
    line-height: 1.6;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .btn-dashboard {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #94a3b8;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .btn-dashboard:hover {
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.1);
    border-color: rgba(56, 189, 248, 0.3);
    transform: translateY(-1px);
  }
</style>
</head>
<body>

<div class="container">
  <div class="badge">STEM 物理力學互動模擬</div>
  <h1>峽谷橋樑工程師</h1>
  <p class="desc">
    利用桁架結構與材料力學特性，在預算內設計能乘載重型卡車通行的橋樑。請依您的裝置點選模式展開挑戰：
  </p>

  <div class="mode-grid">
    <div class="mode-card">
      <div>
        <div class="mode-title">
          <span>經典挑戰模式</span>
          <span style="color: #38bdf8;">★</span>
        </div>
        <div class="mode-desc">
          包含基礎教學引導關卡與10道漸進式重力考驗。考驗三角形桁架配置與最佳預算效益。
        </div>
      </div>
      <div class="btn-group">
        <a href="classic.html" class="btn-launch btn-desktop">💻 電腦桌機版</a>
        <a href="mobile.html" class="btn-launch btn-mobile">📱 手機觸控版</a>
      </div>
    </div>

    <div class="mode-card">
      <div>
        <div class="mode-title">
          <span>創客沙盒模式</span>
          <span class="tag-sandbox">SANDBOX</span>
        </div>
        <div class="mode-desc">
          無預算與構件限制，自訂網格維度、水中基柱與雙材料系統，進行極限載重應力破壞與跳台實驗。
        </div>
      </div>
      <div class="btn-group">
        <a href="sandbox.html" class="btn-launch btn-sandbox">🛠️ 進入沙盒模式</a>
      </div>
    </div>
  </div>

  <div class="footer-note">
    <div>
      本模擬系統為非營利教育推廣用途，靈感啟發自經典桁架工程力學與線上物理模擬遊戲。<br>
      由本科技中心針對教學及遊玩重新設計優化開發，若有授課需求歡迎自由運用於教學。
    </div>
    <!-- 數據儀表板入口圖示按鈕 -->
    <a href="dashboard.html" class="btn-dashboard">
      <span>📊</span>
      <span>即時數據</span>
    </a>
  </div>
</div>

</body>
</html>
