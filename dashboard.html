<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Builder - 數據監控儀表板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1a2234 100%);
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Microsoft JhengHei", sans-serif;
    min-height: 100vh;
    padding: 32px 16px;
    display: flex;
    justify-content: center;
  }
  .dashboard {
    width: 100%;
    max-width: 900px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .title-area h1 {
    font-size: 26px;
    font-weight: 800;
    color: #ffffff;
  }
  .title-area p {
    font-size: 13.5px;
    color: #94a3b8;
    margin-top: 4px;
  }
  .refresh-btn {
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #38bdf8;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .refresh-btn:hover {
    background: rgba(56, 189, 248, 0.22);
  }

  /* 核心數值卡片列 */
  .grid-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .metric-card {
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 20px;
    backdrop-filter: blur(16px);
  }
  .metric-label {
    font-size: 12.5px;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 8px;
  }
  .metric-value {
    font-size: 32px;
    font-weight: 800;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .val-sky { color: #38bdf8; }
  .val-amber { color: #facc15; }
  .val-emerald { color: #34d399; }
  .val-purple { color: #c084fc; }

  /* 分析區塊卡片 */
  .analytics-card {
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 24px;
    backdrop-filter: blur(16px);
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #e2e8f0;
  }
  .compare-row {
    margin-bottom: 20px;
  }
  .compare-row:last-child {
    margin-bottom: 0;
  }
  .row-label {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .bar-container {
    height: 12px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
  }
  
  /* 顏色定義 */
  .bg-classic { background: #0284c7; }
  .bg-sandbox { background: #d97706; }
  .bg-desktop { background: #0284c7; }
  .bg-mobile { background: #38bdf8; }
  .bg-sb-desk { background: #d97706; }
  .bg-sb-mob { background: #f59e0b; }

  .bar-segment {
    height: 100%;
    transition: width 0.5s ease;
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    font-size: 12px;
    color: #94a3b8;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }

  .status-footer {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #64748b;
    margin-top: 16px;
  }
</style>
</head>
<body>

<div class="dashboard">
  <div class="header">
    <div class="title-area">
      <h1>峽谷橋樑工程師 - 全域營運監控</h1>
      <p>即時追蹤經典闖關與創客沙盒模式的互動成效</p>
    </div>
    <button class="refresh-btn" id="btn-reload">手動重新整理</button>
  </div>

  <!-- 總指標卡片 -->
  <div class="grid-metrics">
    <div class="metric-card">
      <div class="metric-label">全站總造訪人次 (Total Visits)</div>
      <div class="metric-value val-sky" id="metric-total-visits">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">全站總出發次數 (Total Launches)</div>
      <div class="metric-value val-amber" id="metric-total-launches">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">人均出發模擬次數</div>
      <div class="metric-value val-emerald" id="metric-launch-rate">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">沙盒造訪人次 (佔比)</div>
      <div class="metric-value val-purple" id="metric-sandbox-visits">--</div>
    </div>
  </div>

  <!-- 模式分佈：經典 vs 沙盒 -->
  <div class="analytics-card">
    <div class="card-title">遊戲模式對比（經典挑戰 vs 創客沙盒）</div>

    <div class="compare-row">
      <div class="row-label">
        <span>造訪分佈</span>
        <span id="label-mode-visit-ratio">--</span>
      </div>
      <div class="bar-container">
        <div class="bar-segment bg-classic" id="bar-mode-visit-classic" style="width: 50%;"></div>
        <div class="bar-segment bg-sandbox" id="bar-mode-visit-sandbox" style="width: 50%;"></div>
      </div>
    </div>

    <div class="compare-row">
      <div class="row-label">
        <span>出發次數分佈</span>
        <span id="label-mode-launch-ratio">--</span>
      </div>
      <div class="bar-container">
        <div class="bar-segment bg-classic" id="bar-mode-launch-classic" style="width: 50%;"></div>
        <div class="bar-segment bg-sandbox" id="bar-mode-launch-sandbox" style="width: 50%;"></div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="dot bg-classic"></span> 經典挑戰模式</div>
      <div class="legend-item"><span class="dot bg-sandbox"></span> 創客沙盒模式</div>
    </div>
  </div>

  <!-- 平台分佈細分卡片 -->
  <div class="analytics-card">
    <div class="card-title">各模式平台裝置細分（桌機 vs 手機）</div>

    <!-- 經典模式平台比 -->
    <div class="compare-row">
      <div class="row-label">
        <span>經典挑戰：造訪分佈</span>
        <span id="label-classic-platform-ratio">--</span>
      </div>
      <div class="bar-container">
        <div class="bar-segment bg-desktop" id="bar-classic-desk" style="width: 50%;"></div>
        <div class="bar-segment bg-mobile" id="bar-classic-mob" style="width: 50%;"></div>
      </div>
    </div>

    <!-- 沙盒模式平台比 -->
    <div class="compare-row">
      <div class="row-label">
        <span>創客沙盒：造訪分佈</span>
        <span id="label-sandbox-platform-ratio">--</span>
      </div>
      <div class="bar-container">
        <div class="bar-segment bg-sb-desk" id="bar-sandbox-desk" style="width: 50%;"></div>
        <div class="bar-segment bg-sb-mob" id="bar-sandbox-mob" style="width: 50%;"></div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="dot bg-desktop"></span> 經典電腦桌機</div>
      <div class="legend-item"><span class="dot bg-mobile"></span> 經典手機觸控</div>
      <div class="legend-item"><span class="dot bg-sb-desk"></span> 沙盒電腦桌機</div>
      <div class="legend-item"><span class="dot bg-sb-mob"></span> 沙盒手機觸控</div>
    </div>
  </div>

  <div class="status-footer">
    <span id="last-updated">最後更新：讀取中...</span>
    <span>每 30 秒自動更新（分頁在背景時暫停）</span>
  </div>
</div>

<script src="config.js?v=1"></script>
<script>
const API_URL = (window.BridgeConfig && window.BridgeConfig.ANALYTICS_URL) || "";

async function fetchAnalytics() {
  const btn = document.getElementById("btn-reload");
  btn.textContent = "讀取中...";
  btn.style.opacity = "0.6";

  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    // 經典模式數據
    const cDeskVisit = data.classic_visit || 0;
    const cDeskLaunch = data.classic_launch || 0;
    const cMobVisit = data.mobile_visit || 0;
    const cMobLaunch = data.mobile_launch || 0;
    const classicTotalVisit = cDeskVisit + cMobVisit;
    const classicTotalLaunch = cDeskLaunch + cMobLaunch;

    // 沙盒模式數據 (若尚無資料預設 0)
    const sDeskVisit = data.sandbox_visit || 0;
    const sDeskLaunch = data.sandbox_launch || 0;
    const sMobVisit = data.sandbox_mobile_visit || 0;
    const sMobLaunch = data.sandbox_mobile_launch || 0;
    const sandboxTotalVisit = sDeskVisit + sMobVisit;
    const sandboxTotalLaunch = sDeskLaunch + sMobLaunch;

    // 全站加總
    const totalVisit = classicTotalVisit + sandboxTotalVisit;
    const totalLaunch = classicTotalLaunch + sandboxTotalLaunch;
    const launchRate = totalVisit > 0 ? (totalLaunch / totalVisit).toFixed(1) : "0.0";
    const sandboxVisitPct = totalVisit > 0 ? ((sandboxTotalVisit / totalVisit) * 100).toFixed(0) : "0";

    // 1. 更新頂端核心指標卡片
    document.getElementById("metric-total-visits").textContent = totalVisit.toLocaleString();
    document.getElementById("metric-total-launches").textContent = totalLaunch.toLocaleString();
    document.getElementById("metric-launch-rate").textContent = `${launchRate} 次/人`;
    document.getElementById("metric-sandbox-visits").textContent = `${sandboxTotalVisit} (${sandboxVisitPct}%)`;

    // 2. 模式對比（經典 vs 沙盒）長條圖
    const modeVisitClassicPct = totalVisit > 0 ? (classicTotalVisit / totalVisit * 100) : 50;
    const modeVisitSandboxPct = totalVisit > 0 ? (sandboxTotalVisit / totalVisit * 100) : 50;
    document.getElementById("bar-mode-visit-classic").style.width = `${modeVisitClassicPct}%`;
    document.getElementById("bar-mode-visit-sandbox").style.width = `${modeVisitSandboxPct}%`;
    document.getElementById("label-mode-visit-ratio").textContent = 
      `經典 ${classicTotalVisit} (${modeVisitClassicPct.toFixed(0)}%) / 沙盒 ${sandboxTotalVisit} (${modeVisitSandboxPct.toFixed(0)}%)`;

    const modeLaunchClassicPct = totalLaunch > 0 ? (classicTotalLaunch / totalLaunch * 100) : 50;
    const modeLaunchSandboxPct = totalLaunch > 0 ? (sandboxTotalLaunch / totalLaunch * 100) : 50;
    document.getElementById("bar-mode-launch-classic").style.width = `${modeLaunchClassicPct}%`;
    document.getElementById("bar-mode-launch-sandbox").style.width = `${modeLaunchSandboxPct}%`;
    document.getElementById("label-mode-launch-ratio").textContent = 
      `經典 ${classicTotalLaunch} (${modeLaunchClassicPct.toFixed(0)}%) / 沙盒 ${sandboxTotalLaunch} (${modeLaunchSandboxPct.toFixed(0)}%)`;

    // 3. 經典模式平台比（桌機 vs 手機）
    const cDeskPct = classicTotalVisit > 0 ? (cDeskVisit / classicTotalVisit * 100) : 50;
    const cMobPct = classicTotalVisit > 0 ? (cMobVisit / classicTotalVisit * 100) : 50;
    document.getElementById("bar-classic-desk").style.width = `${cDeskPct}%`;
    document.getElementById("bar-classic-mob").style.width = `${cMobPct}%`;
    document.getElementById("label-classic-platform-ratio").textContent = 
      `桌機 ${cDeskVisit} (${cDeskPct.toFixed(0)}%) / 手機 ${cMobVisit} (${cMobPct.toFixed(0)}%)`;

    // 4. 沙盒模式平台比（桌機 vs 手機）
    const sDeskPct = sandboxTotalVisit > 0 ? (sDeskVisit / sandboxTotalVisit * 100) : 50;
    const sMobPct = sandboxTotalVisit > 0 ? (sMobVisit / sandboxTotalVisit * 100) : 50;
    document.getElementById("bar-sandbox-desk").style.width = `${sDeskPct}%`;
    document.getElementById("bar-sandbox-mob").style.width = `${sMobPct}%`;
    document.getElementById("label-sandbox-platform-ratio").textContent = 
      `桌機 ${sDeskVisit} (${sDeskPct.toFixed(0)}%) / 手機 ${sMobVisit} (${sMobPct.toFixed(0)}%)`;

    document.getElementById("last-updated").textContent = `最後更新：${new Date().toLocaleTimeString("zh-TW")}`;
  } catch (err) {
    document.getElementById("last-updated").textContent = "連線取得資料失敗，請稍後重試";
  } finally {
    btn.textContent = "手動重新整理";
    btn.style.opacity = "1";
  }
}

document.getElementById("btn-reload").addEventListener("click", fetchAnalytics);

// 頁面載入立即抓取一次，並每30秒自動輪詢；分頁在背景時暫停，回到前景立即更新
let pollTimer = null;
function startPolling() { if (!pollTimer) pollTimer = setInterval(fetchAnalytics, 30000); }
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopPolling(); }
  else { fetchAnalytics(); startPolling(); }
});
fetchAnalytics();
if (!document.hidden) startPolling();
</script>
</body>
</html>
